    <!-- Script pour gérer le routage SPA sur GitHub Pages et détecter la base URL -->
    <script type="text/javascript">
      // Détecter la base URL en fonction du déploiement
      (function() {
        window.APP_CONFIG = window.APP_CONFIG || {};
        
        // Détecter si nous sommes sur GitHub Pages
        const isGitHubPages = window.location.hostname.includes('github.io');
        const isNetlify = window.location.hostname.includes('netlify.app');
        
        // Déterminer la base URL
        if (isGitHubPages) {
          if (window.location.hostname === 'collectifilefeydeau.github.io') {
            window.APP_CONFIG.BASE_URL = '/1Hall1Artiste/';
          } else if (window.location.hostname === 'julienfritsch44.github.io') {
            window.APP_CONFIG.BASE_URL = '/Collectif-Feydeau---app/';
          } else {
            // Fallback pour d'autres déploiements GitHub Pages
            window.APP_CONFIG.BASE_URL = '/' + window.location.pathname.split('/')[1] + '/';
          }
        } else {
          // Pour Netlify et autres déploiements
          window.APP_CONFIG.BASE_URL = '/';
        }
        
        console.log('Détection de la base URL:', window.APP_CONFIG.BASE_URL);

        // Mise à jour dynamique du lien favicon
        document.getElementById('favicon-link').href = window.APP_CONFIG.BASE_URL + 'favicon.ico';
      })();

      // Redirection URL propre → route hash (HashRouter).
      // Ex: /reservations → /#/reservations, /reservations/confirm?token=X → /#/reservations/confirm?token=X
      // Permet de partager/taper des URL sans '#'. Les liens en '#' restent inchangés.
      (function() {
        var loc = window.location;
        if (loc.hash) return;                          // déjà en hash
        if (loc.search && loc.search[1] === '/') return; // truc 404 GitHub Pages (géré ci-dessous)
        var base = (window.APP_CONFIG && window.APP_CONFIG.BASE_URL) || '/';
        var route = loc.pathname.indexOf(base) === 0
          ? loc.pathname.slice(base.length)
          : loc.pathname.replace(/^\/+/, '');
        if (route) {
          loc.replace(base + '#/' + route + loc.search);
        }
      })();
      
      // Script de redirection pour les routes SPA sur GitHub Pages
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
