name: ⏰ Rappel visite 3h avant

# Le plan Vercel Hobby est limité à 1 cron/jour (voir
# docs/FONCTIONNEMENT-INSCRIPTIONS-FILE-ATTENTE.md), or ce rappel a besoin d'une
# granularité horaire. On déclenche donc l'endpoint depuis GitHub Actions, qui
# reste gratuit. L'endpoint est authentifié par CRON_SECRET, comme pour Vercel.
on:
  schedule:
    # Toutes les heures. Un run manqué ou décalé est sans conséquence : le job
    # rattrape TOUTE visite partant dans moins de 4h dont le rappel n'est pas
    # encore parti, et reminder3hSent évite le doublon.
    #
    # ⚠️ GitHub DÉSACTIVE un workflow planifié après 60 jours sans activité sur
    # le dépôt — soit la situation normale entre deux éditions du festival.
    # Le réactiver fait partie de la checklist d'avant-festival
    # (docs/CHECKLIST-AVANT-FESTIVAL.md).
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send:
    name: Envoi des rappels
    runs-on: ubuntu-latest
    steps:
      - name: 📮 Déclencher le job
        env:
          SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET absent des secrets du dépôt"
            exit 1
          fi
          base="${SITE_URL:-https://www.1hall1artiste.fr}"
          # --fail-with-body : un 401/500 doit faire échouer le run (et notifier),
          # pas passer silencieusement comme le ferait un curl nu.
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base}/api/visit-emails?type=send-3h-reminder"
